# The heap takes almost the whole limit. Nothing is left for non-heap memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: app
          image: jvm-fit-demo/orders:1.0.0
          imagePullPolicy: Never
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx450m"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
