name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - name: helm and kubectl versions
        run: helm version --short && kubectl version --client
      - name: gofmt and go vet
        run: make lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Test
        run: go test -race ./...
      - name: Build
        run: make build
      - name: Smoke test
        run: |
          ./bin/jvm-fit --help
          ./bin/jvm-fit scan testdata/ --fail-on none
          ./bin/jvm-fit scan testdata/ --format sarif -o /tmp/jvm-fit.sarif --fail-on none
          ./bin/jvm-fit scan testdata/payments-api.yaml --fail-on critical
          if ./bin/jvm-fit scan testdata/payments-api.yaml --fail-on high; then echo "want exit 1"; exit 1; fi
          ./bin/jvm-fit scan internal/loader/testdata/spring-app -f internal/loader/testdata/spring-values-prod.yaml --fail-on none
          ./bin/jvm-fit scan internal/loader/testdata/kustomize/overlays/prod --fail-on none

  # Runs the GitHub Action from this checkout on testdata/.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Report only
        id: report
        uses: ./
        with:
          path: testdata
          fail-on: none
          sarif-file: ${{ runner.temp }}/jvm-fit.sarif
      - name: Check outputs
        env:
          FINDINGS: ${{ steps.report.outputs.findings }}
          SARIF: ${{ runner.temp }}/jvm-fit.sarif
        run: |
          test "$FINDINGS" = 10 || { echo "findings = $FINDINGS, want 10"; exit 1; }
          grep -q '"version": "2.1.0"' "$SARIF"
      - name: Fail on high
        id: fail
        continue-on-error: true
        uses: ./
        with:
          path: testdata/payments-api.yaml
          summary: "false"
      - name: Check the step failed
        if: steps.fail.outcome != 'failure'
        run: echo "want failure, got ${{ steps.fail.outcome }}" && exit 1

  # Starts real JVMs (JDK 11, 17, 21) in Docker with the limits from the test
  # cases and checks the model predicts the same heap, CPU count and GC.
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pull JDK images
        run: for v in 11 17 21; do docker pull -q eclipse-temurin:$v-jre; done
      - name: Docker info
        run: docker info --format 'cgroup v{{.CgroupVersion}}, {{.NCPU}} CPUs, {{.MemTotal}} bytes'
      - name: Model vs real JVM
        run: make evidence
