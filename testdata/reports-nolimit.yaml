# Bad: no memory limit, heap from the node; JAVA_OPTS via sh -c.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reports
spec:
  serviceName: reports
  selector:
    matchLabels: {app: reports}
  template:
    metadata:
      labels: {app: reports}
    spec:
      containers:
        - name: app
          image: ghcr.io/acme/reports:2.3.0
          command: ["sh", "-c", "exec java $JAVA_OPTS -jar /app/reports.jar"]
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=85 -XX:ActiveProcessorCount=4"
          resources:
            requests: {memory: 2Gi, cpu: "1"}
            limits: {cpu: "2"}
        - name: nginx
          image: nginx:1.27
