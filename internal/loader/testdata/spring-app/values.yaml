image:
  registry: docker.io
  repository: eclipse-temurin
  tag: 17-jre
  pullPolicy: IfNotPresent

replicaCount: 2

## Used when resources is empty. One of: none, nano, micro, small, medium, large.
resourcesPreset: small
resources: {}

## JVM options, passed to the container as JAVA_OPTS.
javaOpts: "-Xmx600m"

## Extra env vars, for example JAVA_TOOL_OPTIONS.
extraEnvVars: []

containerPorts:
  http: 8080

livenessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 5

startupProbe:
  enabled: false
  periodSeconds: 5
  failureThreshold: 30

service:
  type: ClusterIP
  port: 80
